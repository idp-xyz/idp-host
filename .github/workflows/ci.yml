name: CI

# The merge gate of idp-host: formatting and vet, unit and contract tests (race detector on), the
# integration suite against a throwaway PostgreSQL (the Makefile starts it in Docker), and the
# offline image builds. The compose end-to-end (deploy/e2e.sh) is not run here yet: it needs the
# idp-mcp fixture image, which is built from local SDK checkouts (idp-mcp/deploy/fixtures/build.sh).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit, contract, integration, images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Formatting, vet, unit and contract tests
        run: make test
      - name: Integration tests (PostgreSQL in Docker)
        run: make test-integration
      - name: Image builds (static binaries, docker build --network none)
        run: |
          bash deploy/build.sh idp-host:ci
          bash deploy/fixtures/build-fakemodel.sh idp-host-fakemodel:ci
      - name: Image vulnerabilities (trivy; report only until the first results are reviewed)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 idp-host:ci
      - name: Reference harness worker is executable
        run: python3 -I deploy/harness-worker/worker.py --help > /dev/null
